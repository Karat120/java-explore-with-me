server.port=8080

spring.datasource.url=jdbc:postgresql://${EWM_DB_HOST:localhost}:${EWM_DB_PORT:5432}/${EWM_DB_NAME:ewm}
spring.datasource.username=${EWM_DB_USER:ewm}
spring.datasource.password=${EWM_DB_PASSWORD:ewm}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

stats-server.url=${STATS_SERVER_URL:http://localhost:9090}

management.endpoints.web.exposure.include=health,info
